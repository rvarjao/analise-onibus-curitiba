name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar configuração pública do site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          key = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname or not parsed.hostname.endswith(".supabase.co") or parsed.path or parsed.query or parsed.fragment:
              raise SystemExit("SUPABASE_URL deve ser a URL HTTPS do projeto, como https://projeto.supabase.co")
          if not key.startswith("sb_publishable_"):
              raise SystemExit("SUPABASE_PUBLISHABLE_KEY deve ser uma chave publishable do Supabase")
          config = {"supabaseUrl": url, "supabasePublishableKey": key}
          Path("site/config.js").write_text("window.APP_CONFIG = " + json.dumps(config) + ";\n")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
